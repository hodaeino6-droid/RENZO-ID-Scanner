name: Build APKs

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SCANNER_DEBUG: app/build/outputs/apk/debug/app-debug.apk
      SCANNER_RELEASE: app/build/outputs/apk/release/app-release.apk
      SAMPLE_DEBUG: sample/build/outputs/apk/debug/sample-debug.apk
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (Platform 34 + Build Tools 34.0.0)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Verify SDK components
        run: |
          set -e
          test -d "$ANDROID_HOME/platforms/android-34"   || { echo "::error::SDK Platform 34 missing"; exit 1; }
          test -d "$ANDROID_HOME/build-tools/34.0.0"     || { echo "::error::Build Tools 34.0.0 missing"; exit 1; }
          java -version

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build scanner (debug + release) and sample exporter (debug)
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease :sample:assembleDebug

      - name: Verify APKs exist and print sizes
        run: |
          missing=0
          for f in "$SCANNER_DEBUG" "$SCANNER_RELEASE" "$SAMPLE_DEBUG"; do
            if [ ! -s "$f" ]; then
              echo "::error::APK missing or empty: $f"
              missing=1
            else
              bytes=$(stat -c %s "$f")
              mb=$(awk -v b="$bytes" 'BEGIN { printf "%.3f", b/1048576 }')
              echo "$f : $bytes bytes ($mb MB)"
              echo "- \`$f\`: **$bytes bytes** ($mb MB)" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Upload Scanner Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RENZO-ID-Scanner-debug
          path: ${{ env.SCANNER_DEBUG }}
          if-no-files-found: error

      - name: Upload Scanner Release APK (debug-signed TEST build unless keystore.properties is provided)
        uses: actions/upload-artifact@v4
        with:
          name: RENZO-ID-Scanner-release
          path: ${{ env.SCANNER_RELEASE }}
          if-no-files-found: error

      - name: Upload Sample Exporter Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Sample-Exporter-debug
          path: ${{ env.SAMPLE_DEBUG }}
          if-no-files-found: error
