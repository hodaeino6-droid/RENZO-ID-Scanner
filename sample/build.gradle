plugins { id 'com.android.application' }
android {
    namespace 'com.renzo.sample'
    compileSdk 34
    defaultConfig {
        applicationId 'com.renzo.sample'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false }
}
